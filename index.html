<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Signal Bot - Live 1 Minute</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 22px 15px;
      background: #0b1b2e;
      border-bottom: 1px solid #163653;
    }

    .header h1 {
      font-size: 25px;
      color: #00d9ff;
      margin-bottom: 7px;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      background: #12324c;
      color: #00d9ff;
      font-size: 12px;
      font-weight: bold;
    }

    .container {
      width: 94%;
      max-width: 850px;
      margin: 20px auto;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select,
    button {
      flex: 1;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #244762;
      background: #0d2135;
      color: white;
      font-size: 15px;
    }

    button {
      background: #00a9d6;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .stat {
      background: #0d2135;
      border: 1px solid #183b57;
      border-radius: 10px;
      padding: 14px 8px;
      text-align: center;
    }

    .stat-title {
      color: #8fa8bd;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: bold;
    }

    .signal-card {
      background: #0d2135;
      border: 1px solid #1c4563;
      border-radius: 15px;
      padding: 25px 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .pair {
      font-size: 18px;
      color: #b7cce0;
      margin-bottom: 12px;
    }

    #signal {
      font-size: 48px;
      font-weight: bold;
      margin: 12px 0;
    }

    .wait {
      color: #ffd166;
    }

    .buy {
      color: #00e676;
    }

    .sell {
      color: #ff5252;
    }

    .strength {
      font-size: 17px;
      color: #b7cce0;
      margin-bottom: 12px;
    }

    .price {
      font-size: 27px;
      font-weight: bold;
      color: #ffffff;
    }

    .countdown {
      margin-top: 15px;
      font-size: 17px;
      color: #00d9ff;
    }

    .status {
      margin-top: 10px;
      color: #829bb0;
      font-size: 12px;
    }

    .history-card {
      background: #0d2135;
      border: 1px solid #1c4563;
      border-radius: 12px;
      padding: 15px;
      overflow-x: auto;
    }

    .history-card h2 {
      font-size: 18px;
      margin-bottom: 12px;
      color: #00d9ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 10px 7px;
      border-bottom: 1px solid #19374f;
      text-align: center;
      font-size: 12px;
    }

    th {
      color: #8fa8bd;
    }

    .win {
      color: #00e676;
      font-weight: bold;
    }

    .loss {
      color: #ff5252;
      font-weight: bold;
    }

    .pending {
      color: #ffd166;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .controls {
        flex-direction: column;
      }

      #signal {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>AI Signal Bot</h1>
    <div class="badge">LIVE MARKET • 1 MINUTE</div>
  </div>

  <div class="container">

    <div class="controls">

      <select id="pair">
        <option value="EURUSD">EUR/USD</option>
        <option value="GBPUSD">GBP/USD</option>
        <option value="USDJPY">USD/JPY</option>
        <option value="AUDUSD">AUD/USD</option>
        <option value="USDCAD">USD/CAD</option>
        <option value="USDCHF">USD/CHF</option>
        <option value="NZDUSD">NZD/USD</option>
        <option value="EURGBP">EUR/GBP</option>
        <option value="EURJPY">EUR/JPY</option>
        <option value="GBPJPY">GBP/JPY</option>
      </select>

      <button onclick="getLiveSignal()">
        GET SIGNAL
      </button>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">TOTAL</div>
        <div class="stat-value" id="total">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">BUY</div>
        <div class="stat-value buy" id="buyCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">SELL</div>
        <div class="stat-value sell" id="sellCount">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">WIN RATE</div>
        <div class="stat-value" id="winRate">0%</div>
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-title">WINS</div>
        <div class="stat-value win" id="wins">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">LOSSES</div>
        <div class="stat-value loss" id="losses">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">TIMEFRAME</div>
        <div class="stat-value">M1</div>
      </div>

      <div class="stat">
        <div class="stat-title">EXPIRY</div>
        <div class="stat-value">60s</div>
      </div>

    </div>

    <div class="signal-card">

      <div class="pair">
        <span id="pairName">EUR/USD</span>
      </div>

      <div id="signal" class="wait">
        WAIT
      </div>

      <div class="strength">
        Strength:
        <span id="strength">--</span>
      </div>

      <div class="price">
        <span id="price">--</span>
      </div>

      <div class="countdown">
        Next signal:
        <span id="countdown">60</span>s
      </div>

      <div class="status" id="status">
        Connecting to live market...
      </div>

    </div>

    <div class="history-card">

      <h2>Signal History</h2>

      <table>

        <thead>
          <tr>
            <th>Time</th>
            <th>Pair</th>
            <th>Signal</th>
            <th>Strength</th>
            <th>Price</th>
            <th>Expiry</th>
            <th>Result</th>
          </tr>
        </thead>

        <tbody id="history">
        </tbody>

      </table>

    </div>

  </div>

<script>

const API_URL = "/.netlify/functions/signal";

const EXPIRY_SECONDS = 60;

let countdown = 60;

let wins = 0;
let losses = 0;
let total = 0;
let buyCount = 0;
let sellCount = 0;

let historyData = [];

let currentSignal = null;


// ------------------------------
// LIVE SIGNAL
// ------------------------------

async function getLiveSignal() {

  const pair = document.getElementById("pair").value;

  document.getElementById("pairName").textContent =
    formatPair(pair);

  document.getElementById("status").textContent =
    "Fetching live market data...";

  try {

    const url =
      API_URL +
      "?symbol=" +
      encodeURIComponent(pair) +
      "&timeframe=M1";

    const response = await fetch(
      url,
      {
        cache: "no-store"
      }
    );

    const data = await response.json();

    console.log("Signal API:", data);

    if (data.status === "ERROR") {

      showWait();

      document.getElementById("status").textContent =
        data.message || "API error";

      return;
    }

    if (data.status === "WAIT") {

      showWait();

      document.getElementById("status").textContent =
        data.message || "Waiting for candles";

      return;
    }

    if (data.signal) {

      displaySignal(data);

      saveSignal(data);

      document.getElementById("status").textContent =
        "Live market data connected";

    }

  } catch (error) {

    console.error(error);

    showWait();

    document.getElementById("status").textContent =
      "Connection error: " + error.message;
  }
}


// ------------------------------
// DISPLAY SIGNAL
// ------------------------------

function displaySignal(data) {

  const signalElement =
    document.getElementById("signal");

  signalElement.textContent =
    data.signal || "WAIT";

  signalElement.className =
    "";

  if (data.signal === "BUY") {

    signalElement.classList.add("buy");

  } else if (data.signal === "SELL") {

    signalElement.classList.add("sell");

  } else {

    signalElement.classList.add("wait");
  }

  document.getElementById("strength").textContent =
    data.strength != null
      ? data.strength + "%"
      : "--";

  document.getElementById("price").textContent =
    data.price != null
      ? data.price
      : "--";
}


// ------------------------------
// WAIT
// ------------------------------

function showWait() {

  const signalElement =
    document.getElementById("signal");

  signalElement.textContent =
    "WAIT";

  signalElement.className =
    "wait";

  document.getElementById("strength").textContent =
    "--";

  document.getElementById("price").textContent =
    "--";
}


// ------------------------------
// SAVE SIGNAL
// ------------------------------

function saveSignal(data) {

  if (
    !data.signal ||
    data.signal === "WAIT"
  ) {
    return;
  }

  const item = {

    time: new Date().toLocaleTimeString(
      "en-IN",
      {
        timeZone: "Asia/Kolkata"
      }
    ),

    pair: data.symbol || "EURUSD",

    signal: data.signal,

    strength: data.strength || 0,

    price: data.price || 0,

    expiry: "60s",

    result: "PENDING"
  };

  historyData.unshift(item);

  if (historyData.length > 20) {
    historyData.pop();
  }

  total++;

  if (data.signal === "BUY") {
    buyCount++;
  }

  if (data.signal === "SELL") {
    sellCount++;
  }

  currentSignal = item;

  updateStats();

  renderHistory();
}


// ------------------------------
// STATS
// ------------------------------

function updateStats() {

  document.getElementById("total").textContent =
    total;

  document.getElementById("buyCount").textContent =
    buyCount;

  document.getElementById("sellCount").textContent =
    sellCount;

  document.getElementById("wins").textContent =
    wins;

  document.getElementById("losses").textContent =
    losses;

  const completed =
    wins + losses;

  const rate =
    completed > 0
      ? ((wins / completed) * 100).toFixed(1)
      : 0;

  document.getElementById("winRate").textContent =
    rate + "%";
}


// ------------------------------
// HISTORY
// ------------------------------

function renderHistory() {

  const table =
    document.getElementById("history");

  table.innerHTML = "";

  historyData.forEach(item => {

    const row =
      document.createElement("tr");

    let resultClass =
      "pending";

    if (item.result === "WIN") {
      resultClass = "win";
    }

    if (item.result === "LOSS") {
      resultClass = "loss";
    }

    row.innerHTML = `

      <td>${item.time}</td>

      <td>${formatPair(item.pair)}</td>

      <td>${item.signal}</td>

      <td>${item.strength}%</td>

      <td>${item.price}</td>

      <td>${item.expiry}</td>

      <td class="${resultClass}">
        ${item.result}
      </td>

    `;

    table.appendChild(row);

  });
}


// ------------------------------
// PAIR FORMAT
// ------------------------------

function formatPair(pair) {

  if (!pair) {
    return "--";
  }

  const clean =
    pair.replace("/", "");

  if (clean.length === 6) {

    return (
      clean.substring(0, 3) +
      "/" +
      clean.substring(3)
    );
  }

  return pair;
}


// ------------------------------
// COUNTDOWN
// ------------------------------

setInterval(() => {

  countdown--;

  document.getElementById("countdown").textContent =
    countdown;

  if (countdown <= 0) {

    countdown = EXPIRY_SECONDS;

    getLiveSignal();
  }

}, 1000);


// ------------------------------
// PAIR CHANGE
// ------------------------------

document.getElementById("pair")
  .addEventListener(
    "change",
    () => {

      const pair =
        document.getElementById("pair").value;

      document.getElementById("pairName")
        .textContent =
        formatPair(pair);

      showWait();

      countdown = 60;
    }
  );


// ------------------------------
// START
// ------------------------------

getLiveSignal();

</script>

</body>
</html>
