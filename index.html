<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>AI Signal Bot</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:#fff;
  font-size:12px;
}

/* HEADER */

.header{
  text-align:center;
  padding:9px 6px;
  background:#0b1b2e;
  border-bottom:1px solid #183b57;
}

.header h1{
  font-size:19px;
  color:#00d9ff;
  margin-bottom:4px;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:12px;
  background:#12324c;
  color:#00d9ff;
  font-size:8px;
  font-weight:bold;
}

/* MAIN */

.container{
  width:96%;
  max-width:520px;
  margin:7px auto;
}

/* INDIA TIME */

.india-time{
  text-align:center;
  background:#0d2135;
  border:1px solid #183b57;
  border-radius:6px;
  padding:6px;
  margin-bottom:6px;
  color:#00d9ff;
  font-size:11px;
  font-weight:bold;
}

/* CONTROLS */

.controls{
  display:flex;
  gap:5px;
  margin-bottom:6px;
}

select,
button{
  height:35px;
  padding:4px 7px;
  border-radius:6px;
  border:1px solid #244762;
  background:#0d2135;
  color:#fff;
  font-size:12px;
}

select{
  flex:1.2;
}

button{
  flex:1;
  background:#00a9d6;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  margin-bottom:4px;
}

.stat{
  background:#0d2135;
  border:1px solid #183b57;
  border-radius:6px;
  padding:5px 2px;
  text-align:center;
}

.stat-title{
  color:#8fa8bd;
  font-size:7px;
  margin-bottom:2px;
}

.stat-value{
  font-size:14px;
  font-weight:bold;
}

.buy{
  color:#00e676;
}

.sell{
  color:#ff5252;
}

/* SIGNAL */

.signal-card{
  background:#0d2135;
  border:1px solid #1c4563;
  border-radius:7px;
  padding:9px 5px;
  text-align:center;
  margin-bottom:6px;
}

.pair{
  color:#b7cce0;
  font-size:12px;
  margin-bottom:1px;
}

#signal{
  font-size:28px;
  font-weight:bold;
  margin:2px 0;
}

.wait{
  color:#ffd166;
}

.strength{
  color:#a9bfd2;
  font-size:9px;
}

.price{
  font-size:15px;
  font-weight:bold;
  margin-top:2px;
}

.countdown{
  color:#00d9ff;
  font-size:10px;
  margin-top:4px;
}

.status{
  color:#7892a7;
  font-size:8px;
  margin-top:3px;
}

/* HISTORY */

.history-card{
  background:#0d2135;
  border:1px solid #1c4563;
  border-radius:7px;
  padding:6px;
  overflow-x:auto;
}

.history-card h2{
  color:#00d9ff;
  font-size:11px;
  margin-bottom:4px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:430px;
}

th,
td{
  padding:4px 2px;
  border-bottom:1px solid #19374f;
  text-align:center;
  font-size:7px;
}

th{
  color:#8fa8bd;
}

.win{
  color:#00e676;
  font-weight:bold;
}

.loss{
  color:#ff5252;
  font-weight:bold;
}

.pending{
  color:#ffd166;
  font-weight:bold;
}

/* MOBILE */

@media(max-width:400px){

  .container{
    width:97%;
  }

  .stat{
    padding:4px 1px;
  }

  .stat-title{
    font-size:6px;
  }

  .stat-value{
    font-size:12px;
  }

  #signal{
    font-size:24px;
  }

  .price{
    font-size:13px;
  }

  .india-time{
    font-size:10px;
    padding:5px;
  }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

  <h1>AI Signal Bot</h1>

  <div class="badge">
    LIVE MARKET • 1 MINUTE
  </div>

</div>


<div class="container">


<!-- INDIA TIME -->

<div
  class="india-time"
  id="indiaTime"
>
  India Time: --
</div>


<!-- CONTROLS -->

<div class="controls">

  <select id="pair">

    <option value="EURUSD">
      EUR/USD
    </option>

    <option value="GBPUSD">
      GBP/USD
    </option>

    <option value="USDJPY">
      USD/JPY
    </option>

    <option value="AUDUSD">
      AUD/USD
    </option>

    <option value="USDCAD">
      USD/CAD
    </option>

    <option value="USDCHF">
      USD/CHF
    </option>

    <option value="NZDUSD">
      NZD/USD
    </option>

    <option value="EURGBP">
      EUR/GBP
    </option>

    <option value="EURJPY">
      EUR/JPY
    </option>

    <option value="GBPJPY">
      GBP/JPY
    </option>

  </select>


  <button
    onclick="getLiveSignal()"
  >
    GET SIGNAL
  </button>

</div>


<!-- TOP STATS -->

<div class="stats">

  <div class="stat">

    <div class="stat-title">
      TOTAL
    </div>

    <div
      class="stat-value"
      id="total"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      BUY
    </div>

    <div
      class="stat-value buy"
      id="buyCount"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      SELL
    </div>

    <div
      class="stat-value sell"
      id="sellCount"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      WIN RATE
    </div>

    <div
      class="stat-value"
      id="winRate"
    >
      0%
    </div>

  </div>

</div>


<!-- SECOND STATS -->

<div class="stats">

  <div class="stat">

    <div class="stat-title">
      WINS
    </div>

    <div
      class="stat-value buy"
      id="wins"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      LOSSES
    </div>

    <div
      class="stat-value sell"
      id="losses"
    >
      0
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      TIME
    </div>

    <div class="stat-value">
      M1
    </div>

  </div>


  <div class="stat">

    <div class="stat-title">
      EXPIRY
    </div>

    <div class="stat-value">
      60s
    </div>

  </div>

</div>


<!-- SIGNAL CARD -->

<div class="signal-card">


  <div
    class="pair"
    id="pairName"
  >
    EUR/USD
  </div>


  <div
    id="signal"
    class="wait"
  >
    WAIT
  </div>


  <div class="strength">

    Strength:
    
    <span id="strength">
      --
    </span>

  </div>


  <div class="price">

    <span id="price">
      --
    </span>

  </div>


  <div class="countdown">

    Next signal:

    <span id="countdown">
      60
    </span>

    s

  </div>


  <div
    class="status"
    id="status"
  >
    Connecting to live market...
  </div>


</div>


<!-- HISTORY -->

<div class="history-card">

  <h2>
    Signal History
  </h2>


  <table>

    <thead>

      <tr>

        <th>
          Time
        </th>

        <th>
          Pair
        </th>

        <th>
          Signal
        </th>

        <th>
          Strength
        </th>

        <th>
          Price
        </th>

        <th>
          Expiry
        </th>

        <th>
          Result
        </th>

      </tr>

    </thead>


    <tbody id="history">
    </tbody>

  </table>

</div>


</div>


<script>


/* =====================================
   API
===================================== */

const API_URL =
  "/.netlify/functions/signal";


const EXPIRY =
  60;


let countdown =
  60;


/* =====================================
   LOCAL STORAGE
===================================== */

let historyData =
  JSON.parse(
    localStorage.getItem(
      "signalHistory"
    ) || "[]"
  );


let wins =
  Number(
    localStorage.getItem("wins") || 0
  );


let losses =
  Number(
    localStorage.getItem("losses") || 0
  );


let total =
  Number(
    localStorage.getItem("total") || 0
  );


let buyCount =
  Number(
    localStorage.getItem("buyCount") || 0
  );


let sellCount =
  Number(
    localStorage.getItem("sellCount") || 0
  );


/* =====================================
   INDIA TIME
===================================== */

function updateIndiaTime(){

  const now =
    new Date();

  const time =
    now.toLocaleTimeString(
      "en-IN",
      {
        timeZone:
          "Asia/Kolkata",

        hour:
          "2-digit",

        minute:
          "2-digit",

        second:
          "2-digit",

        hour12:
          true
      }
    );

  document.getElementById(
    "indiaTime"
  ).textContent =
    "India Time: " + time;
}


setInterval(
  updateIndiaTime,
  1000
);


updateIndiaTime();


/* =====================================
   SAVE DATA
===================================== */

function saveData(){

  localStorage.setItem(
    "signalHistory",
    JSON.stringify(
      historyData
    )
  );

  localStorage.setItem(
    "wins",
    wins
  );

  localStorage.setItem(
    "losses",
    losses
  );

  localStorage.setItem(
    "total",
    total
  );

  localStorage.setItem(
    "buyCount",
    buyCount
  );

  localStorage.setItem(
    "sellCount",
    sellCount
  );
}


/* =====================================
   GET LIVE SIGNAL
===================================== */

async function getLiveSignal(){

  const pair =
    document.getElementById(
      "pair"
    ).value;


  document.getElementById(
    "pairName"
  ).textContent =
    formatPair(pair);


  document.getElementById(
    "status"
  ).textContent =
    "Getting live market data...";


  try{

    const url =
      API_URL +
      "?symbol=" +
      encodeURIComponent(pair) +
      "&timeframe=M1";


    const res =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await res.json();


    console.log(
      "LIVE SIGNAL:",
      data
    );


    if(
      data.status ===
      "ERROR"
    ){

      showWait();

      document.getElementById(
        "status"
      ).textContent =
        data.message ||
        "API error";

      return;
    }


    if(
      data.status ===
      "WAIT"
    ){

      showWait();

      document.getElementById(
        "status"
      ).textContent =
        data.message ||
        "Waiting for candles";

      return;
    }


    if(
      data.signal
    ){

      displaySignal(
        data
      );


      if(
        data.signal !==
        "WAIT"
      ){

        addSignal(
          data
        );

      }


      document.getElementById(
        "status"
      ).textContent =
        "Live market data connected";

    }


  }catch(error){

    console.error(
      error
    );


    showWait();


    document.getElementById(
      "status"
    ).textContent =
      "Connection error";

  }

}


/* =====================================
   DISPLAY SIGNAL
===================================== */

function displaySignal(
  data
){

  const el =
    document.getElementById(
      "signal"
    );


  el.textContent =
    data.signal;


  el.className =
    "";


  if(
    data.signal ===
    "BUY"
  ){

    el.classList.add(
      "buy"
    );

  }

  else if(
    data.signal ===
    "SELL"
  ){

    el.classList.add(
      "sell"
    );

  }

  else{

    el.classList.add(
      "wait"
    );

  }


  document.getElementById(
    "strength"
  ).textContent =

    data.strength != null

      ? data.strength + "%"

      : "--";


  document.getElementById(
    "price"
  ).textContent =

    data.price != null

      ? data.price

      : "--";

}


/* =====================================
   WAIT
===================================== */

function showWait(){

  const el =
    document.getElementById(
      "signal"
    );


  el.textContent =
    "WAIT";


  el.className =
    "wait";


  document.getElementById(
    "strength"
  ).textContent =
    "--";


  document.getElementById(
    "price"
  ).textContent =
    "--";

}


/* =====================================
   ADD SIGNAL
===================================== */

function addSignal(
  data
){

  const item = {

    id:
      Date.now(),

    time:
      new Date()
        .toLocaleTimeString(
          "en-IN",
          {
            timeZone:
              "Asia/Kolkata",

            hour:
              "2-digit",

            minute:
              "2-digit",

            second:
              "2-digit",

            hour12:
              true
          }
        ),

    pair:
      data.symbol,

    signal:
      data.signal,

    strength:
      data.strength || 0,

    entry:
      Number(
        data.price
      ),

    result:
      "PENDING",

    createdAt:
      Date.now()

  };


  historyData.unshift(
    item
  );


  if(
    historyData.length >
    30
  ){

    historyData.pop();

  }


  total++;


  if(
    data.signal ===
    "BUY"
  ){

    buyCount++;

  }


  if(
    data.signal ===
    "SELL"
  ){

    sellCount++;

  }


  saveData();

  updateStats();

  renderHistory();


  /*
    Check result after
    60 seconds.
  */

  setTimeout(
    function(){

      checkResult(
        item.id
      );

    },
    EXPIRY * 1000
  );

}


/* =====================================
   CHECK WIN / LOSS
===================================== */

async function checkResult(
  id
){

  const item =
    historyData.find(
      function(x){

        return x.id === id;

      }
    );


  if(
    !item ||
    item.result !==
    "PENDING"
  ){

    return;

  }


  try{

    const url =
      API_URL +
      "?symbol=" +
      encodeURIComponent(
        item.pair
      ) +
      "&timeframe=M1";


    const res =
      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );


    const data =
      await res.json();


    if(
      data.status !==
      "success" ||
      data.price == null
    ){

      return;

    }


    const exitPrice =
      Number(
        data.price
      );


    let result =
      "LOSS";


    if(
      item.signal ===
      "BUY"
    ){

      if(
        exitPrice >
        item.entry
      ){

        result =
          "WIN";

      }

    }


    if(
      item.signal ===
      "SELL"
    ){

      if(
        exitPrice <
        item.entry
      ){

        result =
          "WIN";

      }

    }


    /*
      If entry and exit are
      exactly equal, count as
      LOSS for now.
    */

    item.result =
      result;


    if(
      result ===
      "WIN"
    ){

      wins++;

    }

    else{

      losses++;

    }


    saveData();

    updateStats();

    renderHistory();


  }catch(error){

    console.error(
      "Result error:",
      error
    );

  }

}


/* =====================================
   UPDATE STATS
===================================== */

function updateStats(){

  document.getElementById(
    "total"
  ).textContent =
    total;


  document.getElementById(
    "buyCount"
  ).textContent =
    buyCount;


  document.getElementById(
    "sellCount"
  ).textContent =
    sellCount;


  document.getElementById(
    "wins"
  ).textContent =
    wins;


  document.getElementById(
    "losses"
  ).textContent =
    losses;


  const completed =
    wins + losses;


  const rate =
    completed > 0

      ? (
          wins /
          completed *
          100
        ).toFixed(1)

      : 0;


  document.getElementById(
    "winRate"
  ).textContent =
    rate + "%";

}


/* =====================================
   HISTORY
===================================== */

function renderHistory(){

  const table =
    document.getElementById(
      "history"
    );


  table.innerHTML =
    "";


  historyData.forEach(
    function(item){

      let cls =
        "pending";


      if(
        item.result ===
        "WIN"
      ){

        cls =
          "win";

      }


      if(
        item.result ===
        "LOSS"
      ){

        cls =
          "loss";

      }


      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>
          ${item.time}
        </td>

        <td>
          ${formatPair(item.pair)}
        </td>

        <td>
          ${item.signal}
        </td>

        <td>
          ${item.strength}%
        </td>

        <td>
          ${item.entry}
        </td>

        <td>
          60s
        </td>

        <td class="${cls}">
          ${item.result}
        </td>

      `;


      table.appendChild(
        row
      );

    }
  );

}


/* =====================================
   FORMAT PAIR
===================================== */

function formatPair(
  pair
){

  if(!pair){

    return "--";

  }


  const clean =
    pair.replace(
      "/",
      ""
    );


  if(
    clean.length ===
    6
  ){

    return (

      clean.substring(
        0,
        3
      )

      +

      "/"

      +

      clean.substring(
        3
      )

    );

  }


  return pair;

}


/* =====================================
   COUNTDOWN
===================================== */

setInterval(
  function(){

    countdown--;


    document.getElementById(
      "countdown"
    ).textContent =
      countdown;


    if(
      countdown <= 0
    ){

      countdown =
        EXPIRY;


      getLiveSignal();

    }

  },
  1000
);


/* =====================================
   PAIR CHANGE
===================================== */

document.getElementById(
  "pair"
)
.addEventListener(
  "change",
  function(){

    const pair =
      document.getElementById(
        "pair"
      ).value;


    document.getElementById(
      "pairName"
    ).textContent =
      formatPair(pair);


    showWait();


    countdown =
      60;

  }
);


/* =====================================
   START
===================================== */

updateStats();

renderHistory();

updateIndiaTime();

getLiveSignal();

</script>

</body>

</html>
