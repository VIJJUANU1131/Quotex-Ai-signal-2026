<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live AI Signal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1020;
    color:#fff;
}

.container{
    max-width:480px;
    margin:auto;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin:0;
    font-size:30px;
}

.header p{
    color:#9ca3af;
    margin-top:8px;
}

.card{
    background:#151b2e;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
}

label{
    display:block;
    color:#aeb6c8;
    margin-bottom:8px;
}

select,
button{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:0;
    font-size:16px;
}

select{
    background:#0d1324;
    color:white;
    border:1px solid #30384d;
}

button{
    margin-top:14px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.market{
    text-align:center;
    color:#60a5fa;
    font-weight:bold;
    margin-bottom:12px;
}

.signal{
    text-align:center;
    font-size:42px;
    font-weight:bold;
    margin:15px 0;
}

.buy{
    color:#22c55e;
}

.sell{
    color:#ef4444;
}

.wait{
    color:#f59e0b;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.box{
    background:#0d1324;
    padding:13px;
    border-radius:12px;
    text-align:center;
}

.box small{
    display:block;
    color:#8f99ad;
    margin-bottom:5px;
}

.box strong{
    font-size:18px;
}

.status{
    text-align:center;
    margin-top:14px;
    color:#9ca3af;
    font-size:14px;
}

.timer{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin:15px 0;
}

.history-title{
    margin-bottom:10px;
}

.history{
    max-height:300px;
    overflow-y:auto;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr;
    gap:5px;
    padding:10px 5px;
    border-bottom:1px solid #272f44;
    font-size:13px;
    text-align:center;
}

.win{
    color:#22c55e;
    font-weight:bold;
}

.loss{
    color:#ef4444;
    font-weight:bold;
}

.skip{
    color:#f59e0b;
}

.empty{
    text-align:center;
    color:#7d879b;
    padding:20px;
}

.footer{
    text-align:center;
    color:#667085;
    font-size:12px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Live AI Signal</h1>
        <p>Real Candle Analysis • M1</p>
    </div>

    <div class="card">

        <label>Select Market</label>

        <select id="symbol">
            <option value="1HZ100V">Volatility 100 Index</option>
        </select>

        <button onclick="generateSignal()">
            GENERATE LIVE SIGNAL
        </button>

    </div>

    <div class="card">

        <div class="market">
            DERIV SYNTHETIC LIVE
        </div>

        <div id="signal" class="signal wait">
            WAIT
        </div>

        <div class="info">

            <div class="box">
                <small>PRICE</small>
                <strong id="price">--</strong>
            </div>

            <div class="box">
                <small>STRENGTH</small>
                <strong id="strength">--</strong>
            </div>

            <div class="box">
                <small>BUY SCORE</small>
                <strong id="buyScore">--</strong>
            </div>

            <div class="box">
                <small>SELL SCORE</small>
                <strong id="sellScore">--</strong>
            </div>

        </div>

        <div class="timer">
            <span id="timer">60</span>s
        </div>

        <div id="status" class="status">
            Ready
        </div>

    </div>

    <div class="card">

        <h3 class="history-title">
            Signal History
        </h3>

        <div class="row">
            <strong>Time</strong>
            <strong>Signal</strong>
            <strong>Price</strong>
            <strong>Result</strong>
        </div>

        <div id="history" class="history">
            <div class="empty">
                No signals yet
            </div>
        </div>

    </div>

    <div class="card">

        <div class="info">

            <div class="box">
                <small>WINS</small>
                <strong id="wins">0</strong>
            </div>

            <div class="box">
                <small>LOSSES</small>
                <strong id="losses">0</strong>
            </div>

            <div class="box">
                <small>SKIPPED</small>
                <strong id="skips">0</strong>
            </div>

            <div class="box">
                <small>WIN RATE</small>
                <strong id="winRate">0%</strong>
            </div>

        </div>

    </div>

    <div class="footer">
        Data Source: Deriv Synthetic Market
    </div>

</div>


<script>

/* =========================
   BACKEND
========================= */

const BACKEND_URL =
"https://quotex-otc-backend.onrender.com";


/* =========================
   VARIABLES
========================= */

let currentSignal = null;
let currentEntryPrice = null;
let signalTime = null;

let timer = 60;

let historyData = [];

let wins = 0;
let losses = 0;
let skips = 0;


/* =========================
   FETCH CANDLES
========================= */

async function getCandles(){

    const symbol =
        document.getElementById("symbol").value;

    const url =
        BACKEND_URL +
        "/api/v1/candles?symbol=" +
        encodeURIComponent(symbol);

    const response =
        await fetch(url, {
            cache:"no-store"
        });

    if(!response.ok){

        throw new Error(
            "Backend HTTP " + response.status
        );
    }

    const data =
        await response.json();

    if(data.status !== "success"){

        throw new Error(
            data.message ||
            data.error ||
            "Backend error"
        );
    }

    if(!Array.isArray(data.candles)){

        throw new Error(
            "Candles data missing"
        );
    }

    return data.candles;
}


/* =========================
   CANDLE ANALYSIS
========================= */

function analyzeCandles(candles){

    if(!candles || candles.length < 10){

        return {
            signal:"WAIT",
            strength:0,
            buyScore:0,
            sellScore:0,
            reason:"Not enough candles"
        };
    }


    /* Make a copy and sort by time */

    const data =
        [...candles].sort(
            (a,b) =>
            Number(a.epoch) -
            Number(b.epoch)
        );


    const c1 =
        data[data.length - 1];

    const c2 =
        data[data.length - 2];

    const c3 =
        data[data.length - 3];

    const c4 =
        data[data.length - 4];

    const c5 =
        data[data.length - 5];


    const o1 = Number(c1.open);
    const h1 = Number(c1.high);
    const l1 = Number(c1.low);
    const x1 = Number(c1.close);

    const o2 = Number(c2.open);
    const x2 = Number(c2.close);

    const o3 = Number(c3.open);
    const x3 = Number(c3.close);

    const o4 = Number(c4.open);
    const x4 = Number(c4.close);

    const o5 = Number(c5.open);
    const x5 = Number(c5.close);


    if(
        !Number.isFinite(o1) ||
        !Number.isFinite(h1) ||
        !Number.isFinite(l1) ||
        !Number.isFinite(x1)
    ){

        return {
            signal:"WAIT",
            strength:0,
            buyScore:0,
            sellScore:0,
            reason:"Invalid candle"
        };
    }


    let buyScore = 0;
    let sellScore = 0;


    /* =====================
       CANDLE DIRECTION
    ===================== */

    if(x1 > o1)
        buyScore += 20;

    if(x1 < o1)
        sellScore += 20;


    if(x2 > o2)
        buyScore += 12;

    if(x2 < o2)
        sellScore += 12;


    if(x3 > o3)
        buyScore += 10;

    if(x3 < o3)
        sellScore += 10;


    if(x4 > o4)
        buyScore += 6;

    if(x4 < o4)
        sellScore += 6;


    if(x5 > o5)
        buyScore += 4;

    if(x5 < o5)
        sellScore += 4;


    /* =====================
       MOMENTUM
    ===================== */

    if(x1 > x2)
        buyScore += 15;

    if(x1 < x2)
        sellScore += 15;


    if(x2 > x3)
        buyScore += 8;

    if(x2 < x3)
        sellScore += 8;


    /* =====================
       BODY STRENGTH
    ===================== */

    const body =
        Math.abs(x1 - o1);

    const range =
        h1 - l1;


    if(range > 0){

        const bodyRatio =
            body / range;

        if(bodyRatio >= 0.60){

            if(x1 > o1)
                buyScore += 10;

            if(x1 < o1)
                sellScore += 10;
        }

        else if(bodyRatio >= 0.40){

            if(x1 > o1)
                buyScore += 5;

            if(x1 < o1)
                sellScore += 5;
        }
    }


    /* =====================
       TREND CHECK
    ===================== */

    const recentMove =
        x1 - x5;


    if(recentMove > 0)
        buyScore += 5;

    if(recentMove < 0)
        sellScore += 5;


    /* =====================
       FINAL SIGNAL
    ===================== */

    let signal = "WAIT";

    let strength = 0;


    const difference =
        Math.abs(
            buyScore - sellScore
        );


    if(
        buyScore > sellScore &&
        buyScore >= 55 &&
        difference >= 10
    ){

        signal = "BUY";

        strength =
            Math.min(
                buyScore,
                95
            );
    }

    else if(
        sellScore > buyScore &&
        sellScore >= 55 &&
        difference >= 10
    ){

        signal = "SELL";

        strength =
            Math.min(
                sellScore,
                95
            );
    }

    else{

        signal = "WAIT";

        strength =
            Math.max(
                buyScore,
                sellScore
            );
    }


    return {

        signal:signal,

        strength:Math.round(
            strength
        ),

        buyScore:Math.round(
            buyScore
        ),

        sellScore:Math.round(
            sellScore
        ),

        price:x1,

        candleTime:
            c1.epoch || null
    };
}


/* =========================
   GENERATE SIGNAL
========================= */

async function generateSignal(){

    const status =
        document.getElementById("status");

    status.innerText =
        "Loading live candles...";


    try{

        const candles =
            await getCandles();


        const result =
            analyzeCandles(candles);


        updateSignal(result);


        status.innerText =
            "Live candle analysis completed";


    }catch(error){

        console.error(error);

        document.getElementById(
            "signal"
        ).innerText = "ERROR";

        document.getElementById(
            "signal"
        ).className =
            "signal wait";

        status.innerText =
            error.message;

    }
}


/* =========================
   UPDATE SIGNAL UI
========================= */

function updateSignal(result){

    const signalElement =
        document.getElementById("signal");


    signalElement.innerText =
        result.signal;


    signalElement.className =
        "signal " +
        (
            result.signal === "BUY"
            ? "buy"
            :
            result.signal === "SELL"
            ? "sell"
            : "wait"
        );


    document.getElementById(
        "price"
    ).innerText =
        result.price !== undefined
        ? Number(result.price).toFixed(2)
        : "--";


    document.getElementById(
        "strength"
    ).innerText =
        result.strength !== undefined
        ? result.strength + "%"
        : "--";


    document.getElementById(
        "buyScore"
    ).innerText =
        result.buyScore !== undefined
        ? result.buyScore
        : "--";


    document.getElementById(
        "sellScore"
    ).innerText =
        result.sellScore !== undefined
        ? result.sellScore
        : "--";


    /* Save only BUY/SELL */

    if(
        result.signal === "BUY" ||
        result.signal === "SELL"
    ){

        currentSignal =
            result.signal;

        currentEntryPrice =
            Number(result.price);

        signalTime =
            Date.now();


        addHistory({

            time:
                new Date()
                .toLocaleTimeString(),

            signal:
                result.signal,

            entry:
                currentEntryPrice,

            result:
                "PENDING"
        });
    }
}


/* =========================
   HISTORY
========================= */

function addHistory(item){

    historyData.unshift(item);


    if(historyData.length > 20){

        historyData =
            historyData.slice(
                0,
                20
            );
    }


    renderHistory();
}


/* =========================
   CHECK RESULT
========================= */

async function checkSignalResult(){

    if(
        !currentSignal ||
        currentEntryPrice === null
    ){

        return;
    }


    try{

        const candles =
            await getCandles();


        if(
            !candles ||
            candles.length < 2
        ){

            return;
        }


        const data =
            [...candles].sort(
                (a,b) =>
                Number(a.epoch) -
                Number(b.epoch)
            );


        const latest =
            data[data.length - 1];


        const exitPrice =
            Number(latest.close);


        if(
            !Number.isFinite(exitPrice)
        ){

            return;
        }


        const result =
            checkResult(
                currentSignal,
                currentEntryPrice,
                exitPrice
            );


        if(result === "WIN"){

            wins++;
        }

        else if(result === "LOSS"){

            losses++;
        }

        else{

            skips++;
        }


        if(historyData.length > 0){

            historyData[0].result =
                result;

            historyData[0].exit =
                exitPrice;
        }


        updateStats();

        renderHistory();


        currentSignal = null;

        currentEntryPrice = null;


    }catch(error){

        console.log(
            "Result check:",
            error.message
        );
    }
}


/* =========================
   RESULT LOGIC
========================= */

function checkResult(
    signal,
    entryPrice,
    exitPrice
){

    if(signal === "BUY"){

        return exitPrice > entryPrice
            ? "WIN"
            : "LOSS";
    }


    if(signal === "SELL"){

        return exitPrice < entryPrice
            ? "WIN"
            : "LOSS";
    }


    return "SKIP";
}


/* =========================
   HISTORY DISPLAY
========================= */

function renderHistory(){

    const history =
        document.getElementById(
            "history"
        );


    if(historyData.length === 0){

        history.innerHTML =
            '<div class="empty">No signals yet</div>';

        return;
    }


    history.innerHTML =
        historyData
        .map(item => {

            let resultClass =
                "skip";


            if(item.result === "WIN")
                resultClass = "win";


            if(item.result === "LOSS")
                resultClass = "loss";


            return `

                <div class="row">

                    <span>
                        ${item.time}
                    </span>

                    <span class="${
                        item.signal === "BUY"
                        ? "win"
                        : "loss"
                    }">
                        ${item.signal}
                    </span>

                    <span>
                        ${Number(
                            item.entry
                        ).toFixed(2)}
                    </span>

                    <span class="${
                        resultClass
                    }">
                        ${item.result}
                    </span>

                </div>

            `;

        })
        .join("");
}


/* =========================
   STATS
========================= */

function updateStats(){

    document.getElementById(
        "wins"
    ).innerText = wins;


    document.getElementById(
        "losses"
    ).innerText = losses;


    document.getElementById(
        "skips"
    ).innerText = skips;


    const total =
        wins + losses;


    const rate =
        total > 0
        ? (
            wins / total
        ) * 100
        : 0;


    document.getElementById(
        "winRate"
    ).innerText =
        rate.toFixed(1) + "%";
}


/* =========================
   60 SECOND TIMER
========================= */

function startTimer(){

    setInterval(async () => {

        timer--;

        document.getElementById(
            "timer"
        ).innerText = timer;


        if(timer <= 0){

            /*
             * First check the previous
             * signal result.
             */

            await checkSignalResult();


            /*
             * Then generate a new signal.
             */

            await generateSignal();


            timer = 60;

            document.getElementById(
                "timer"
            ).innerText = timer;
        }

    },1000);
}


/* =========================
   START
========================= */

window.addEventListener(
    "load",
    () => {

        updateStats();

        startTimer();

        /*
         * Generate first signal
         * automatically.
         */

        generateSignal();

    }
);

</script>

</body>
</html>
